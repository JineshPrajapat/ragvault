[tool.poetry]
name = "ragvault-backend"
version = "0.1.0"
description = "Build a multi-user, session-based RAG (Retrieval-Augmented Generation) application"
authors = ["JineshPrajapat <prajapatjinesh585@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.133.1"
uvicorn = "^0.41.0"
python-jose = "^3.5.0"
redis = "^7.2.1"
sqlalchemy = "^2.0.47"
asyncpg = "^0.31.0"
psycopg2-binary = "^2.9.11"
pydantic-settings = "^2.13.1"
pydantic = {extras = ["email"], version = "^2.12.5"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = "3.2.2"
aiofiles = "^25.1.0"
python-multipart = "^0.0.22"
pgvector = "^0.4.2"
celery = "^5.6.2"
sentence-transformers = "^5.2.3"
asgiref = "^3.11.1"
langchain-openai = "^1.1.10"
keybert = "^0.9.0"
google-genai = "^1.66.0"
pymupdf = ">=1.24.9,<1.25.0"
pdfplumber = "^0.11.9"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "deptry (>=0.24.0,<0.25.0)"
]
